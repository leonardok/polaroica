# Creates a GitHub release of the version in package.json, by hand: Actions tab → polaroica-build-release →
# Run workflow (on main). It tests and packages the extension, then publishes
# polaroica-extension-<version>.vsix with docs/release-notes/v<version>.md as the release text, plus the
# file's SHA-256. The package is unzipped and checked first: README.md must be the only documentation
# inside it, and docs/ must not be there. Before running it: bump "version" in package.json and write
# the release notes.
name: polaroica-build-release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create it as a draft (check it, then publish it on GitHub)
        type: boolean
        default: false
      prerelease:
        description: Mark it as a pre-release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main (it was started on ${GITHUB_REF_NAME})."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check version and release notes
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          notes="docs/release-notes/v${version}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing. Write the release notes for ${version} first."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/polaroica-extension-${version}" > /dev/null; then
            echo "::error::polaroica-extension-${version} is already released. Bump the version in package.json first."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "notes=${notes}" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Package
        run: npx --yes @vscode/vsce@3.2.1 package --out "polaroica-extension-${{ steps.version.outputs.version }}.vsix"

      - name: Check the package contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          vsix="polaroica-extension-${VERSION}.vsix"
          unzip -Z1 "$vsix" | sort > contents.txt

          {
            echo '### `'"$vsix"'` contents'
            echo
            echo '```'
            cat contents.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # README.md is the extension's page, so it is the only documentation that ships.
          # models/README.md stays: it sits next to the face models it describes.
          unexpected=$(grep -iE '\.(md|markdown)$' contents.txt \
            | grep -vxF 'extension/readme.md' \
            | grep -vxF 'extension/models/README.md' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::$vsix carries documentation other than README.md:"
            echo "$unexpected"
            echo "Add it to .vscodeignore, or allow it in this step."
            exit 1
          fi

          if grep -q '^extension/docs/' contents.txt; then
            echo "::error::$vsix carries docs/. It is in .vscodeignore; check that the ignore file is being read."
            exit 1
          fi

          if ! grep -qix 'extension/readme.md' contents.txt; then
            echo "::error::$vsix has no README.md, so the extension page would be empty."
            exit 1
          fi

          echo "README.md is the only documentation in $vsix." >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          vsix="polaroica-extension-${VERSION}.vsix"
          sha=$(sha256sum "$vsix" | cut -d' ' -f1)
          { cat "$NOTES"; printf '\n`%s` SHA-256: `%s`\n' "$vsix" "$sha"; } > release-body.md
          flags=()
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "polaroica-extension-${VERSION}" "$vsix" \
            --title "polaroica-extension-${VERSION}" \
            --notes-file release-body.md \
            --target "$GITHUB_SHA" \
            "${flags[@]}"
          kind="release"
          if [ "$PRERELEASE" = "true" ]; then kind="pre-release"; fi
          if [ "$DRAFT" = "true" ]; then kind="draft ${kind}"; fi
          echo "Released polaroica-extension-${VERSION} as a ${kind} (${vsix}, SHA-256 ${sha})" >> "$GITHUB_STEP_SUMMARY"
